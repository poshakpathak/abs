name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install
        run: pip install -r requirements/core.txt -r requirements/api.txt pytest httpx mlflow
      - name: Unit tests, including the full-season check against the paper
        run: python -m pytest -q -rs
      - name: Train, validate and register a model with MLflow (local store)
        run: |
          python -m abslive.train --train-end 2026-06-30 --replays 5
          python -c "
          from mlflow import MlflowClient
          v = MlflowClient().get_model_version_by_alias('abs-challenge-policy', 'champion')
          print('champion', v.version, v.tags)
          assert v.tags['gates_passed'] == 'true'
          "
      - name: The advisor's data file is up to date
        run: |
          python -m abslive.export_advisor --out /tmp/advisor_data.js
          cmp /tmp/advisor_data.js web/advisor_data.js

  end-to-end:
    # The whole stack in Docker: train and register a champion, start the stream,
    # replay games through Redpanda, and check Postgres, the API, Grafana and the
    # drift monitor.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      E2E_START: "2026-07-01"
      E2E_GAMES: "30"
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start Redpanda, Postgres, MLflow
        run: docker compose up -d --wait redpanda postgres mlflow
      - name: Train and register the champion
        run: docker compose run --rm trainer
      - name: Start the stream, API, monitor, Prometheus and Grafana
        run: docker compose up -d --wait api && docker compose up -d stream monitor prometheus grafana
      - name: Replay 30 games through Redpanda
        run: docker compose run --rm producer python -m stream.producer --start "$E2E_START" --games "$E2E_GAMES" --rate 0
      - name: "Check: stream equals the batch replay, API, Grafana, quiet monitor"
        run: |
          docker compose run --rm -e E2E_START -e E2E_GAMES \
            -e API_URL=http://api:8000 -e GRAFANA_URL=http://grafana:3000 -e PROMETHEUS_URL=http://prometheus:9090 \
            producer python -m pytest -q -rs -m integration tests/test_integration.py
      - name: Replay one more day with a synthetic 3-inch shift
        run: |
          docker compose run --rm producer python -m stream.producer \
            --start 2026-07-04 --days 1 --rate 0 --drift-from 2026-07-04 --drift-shift 3
      - name: "Check: the drift alert fires"
        run: |
          docker compose run --rm -e E2E_PHASE=drift -e PROMETHEUS_URL=http://prometheus:9090 \
            producer python -m pytest -q -rs -m integration -k drift tests/test_integration.py
      - name: Logs
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color > compose-logs.txt
          for s in stream monitor api trainer mlflow; do
            echo "::group::$s"; docker compose logs --no-color --tail 120 "$s" | grep -v NativeCodeLoader || true; echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-logs
          path: compose-logs.txt
          retention-days: 7

  publish:
    # Push the API image to GitHub Container Registry once everything above passes on main.
    needs: [test, end-to-end]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/abs-api
          tags: |
            type=sha,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
